env:
  CI: "1"

steps:
  - label: ":android: Godot Android bridge"
    command: |
      set -euo pipefail
      export JAVA_HOME=/opt/homebrew/opt/openjdk@17/libexec/openjdk.jdk/Contents/Home
      export ANDROID_HOME=/opt/homebrew/share/android-commandlinetools
      export ANDROID_SDK_ROOT="$ANDROID_HOME"
      export PATH="$JAVA_HOME/bin:$PATH"
      if [[ -d ../nuxie-android/.git ]]; then
        git -C ../nuxie-android fetch origin main --depth 1
        git -C ../nuxie-android checkout --detach FETCH_HEAD
      else
        git clone --depth 1 https://github.com/nuxieai/nuxie-android.git ../nuxie-android
      fi
      export NUXIE_ANDROID_SOURCE_DIR="$(cd ../nuxie-android && pwd)"
      ./gradlew :android-plugin:testDebugUnitTest :android-plugin:assembleDebug :android-plugin:assembleRelease
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 90
    retry:
      automatic:
        - exit_status: -1
          limit: 1

  - label: ":apple: Godot iOS bridge"
    command: |
      set -euo pipefail
      if [[ -d ../godot-4.5.1/.git ]]; then
        git -C ../godot-4.5.1 fetch origin refs/tags/4.5.1-stable --depth 1
        git -C ../godot-4.5.1 checkout --detach FETCH_HEAD
      else
        git clone --depth 1 --branch 4.5.1-stable https://github.com/godotengine/godot.git ../godot-4.5.1
      fi
      export GODOT_SOURCE_DIR="$(cd ../godot-4.5.1 && pwd)"
      cd ios-plugin
      xcodebuild test \
        -scheme NuxieGodotBridge \
        -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=26.2' \
        -skipPackagePluginValidation
      ./scripts/build_xcframework.sh
    agents:
      queue: nuxie-pr
      nuxie-platform: macos
    timeout_in_minutes: 120
    retry:
      automatic:
        - exit_status: -1
          limit: 1
